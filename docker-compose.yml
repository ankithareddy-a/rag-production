version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_pass
      POSTGRES_DB: analytics
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbt_user"]
      interval: 10s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin && airflow scheduler & airflow webserver"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dbt_user:dbt_pass@postgres:5432/analytics
      AIRFLOW__CORE__FERNET_KEY: 'my_fernet_key_32charslong1234567890'
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    volumes:
      - ./airflow:/opt/airflow
      - ./src:/app/src
      - ./dbt:/app/dbt
      - ./great_expectations:/app/great_expectations
